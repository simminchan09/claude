<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b2a3a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>바람의 대지</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <canvas id="hearts" width="400" height="64"></canvas>
  <div id="info"><span id="clock">08:00</span> · <span id="shrineCount">사당 0/8</span></div>
  <canvas id="minimap" width="140" height="140"></canvas>
  <svg id="stamina" width="56" height="56" viewBox="0 0 56 56">
    <circle cx="28" cy="28" r="20" class="ring-bg"/>
    <circle cx="28" cy="28" r="20" class="ring" id="staminaRing"/>
  </svg>
  <div id="toast"></div>
  <div id="prompt"></div>
</div>

<div id="joyBase"><div id="joyKnob"></div></div>

<div id="topButtons">
  <button id="btnEat" class="small">🍎 <span id="appleCount">0</span></button>
  <button id="btnMap" class="small">지도</button>
  <button id="btnFull" class="small">⛶</button>
</div>

<div id="buttons">
  <button id="btnInteract" class="act">상호<br>작용</button>
  <button id="btnSprint" class="act">달리기</button>
  <button id="btnAttack" class="act">공격</button>
  <button id="btnJump" class="act big">점프</button>
</div>

<div id="mapView" class="overlay hidden">
  <canvas id="bigmap" width="600" height="600"></canvas>
  <div class="legend">
    <span><i style="background:#ffa53a"></i>미정화 사당</span>
    <span><i style="background:#4fd2ff"></i>정화된 사당</span>
    <span><i style="background:#c9a0ff"></i>탑</span>
    <span>화면을 터치하면 닫힘</span>
  </div>
</div>

<div id="title" class="overlay">
  <div class="panel">
    <h1>바람의 대지</h1>
    <p class="sub">모바일 오픈월드 어드벤처</p>
    <button id="btnContinue" class="menu hidden">이어하기</button>
    <button id="btnNew" class="menu">새로 시작</button>
    <div class="help">
      <b>조작</b><br>
      왼쪽 화면 드래그: 이동 · 오른쪽 화면 드래그: 시점<br>
      점프 · 공중에서 다시 점프: 패러글라이더 · 가파른 벽으로 이동: 등반<br>
      키보드: WASD 이동, 마우스 드래그 시점, Space 점프, Shift 달리기, J 공격, E 상호작용, Q 사과 먹기, M 지도
    </div>
  </div>
</div>

<div id="gameover" class="overlay hidden">
  <div class="panel">
    <h1>쓰러졌다...</h1>
    <button id="btnRetry" class="menu">다시 일어나기</button>
  </div>
</div>

<div id="rotate" class="overlay">
  <div class="panel"><h2>📱 가로 모드로 돌려주세요</h2><p>가로 화면에서 가장 잘 플레이됩니다.</p>
  <button id="btnIgnoreRotate" class="menu">세로로 계속하기</button></div>
</div>

<script type="module" src="game.js"></script>
</body>
</html>
