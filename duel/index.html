<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eclipse Duel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one letterboxed 16:9 canvas; touch pad overlays the bottom edge on phones. Single dark look by design. */
:root{
  --bg:#05060b; --ink:#e8edf7; --cyan:#5ff3ff; --crimson:#ff4a36; --pad:rgba(255,255,255,.10); --pad-line:rgba(255,255,255,.28);
  --f-display:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;font-family:var(--f-body);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg)}
#c{display:block;width:min(100vw,177.78vh);height:min(56.25vw,100vh);background:#000;outline:none}
#touch{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:flex-end;
  padding:0 16px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
#touch.on{display:flex}
.pad{display:grid;gap:8px;pointer-events:auto}
.dpad{grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,54px)}
.acts{grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,58px)}
.pad button{font:700 15px/1 var(--f-body);color:var(--ink);background:var(--pad);border:1px solid var(--pad-line);
  border-radius:50%;padding:0;backdrop-filter:blur(2px);touch-action:none}
.pad button:active,.pad button.down{background:rgba(255,255,255,.28)}
.pad .ult{border-color:var(--crimson);color:#ffd9cf}
.dpad .up{grid-column:2;grid-row:1}.dpad .lf{grid-column:1;grid-row:2}.dpad .dn{grid-column:2;grid-row:2}.dpad .rt{grid-column:3;grid-row:2}
@media (prefers-reduced-motion: reduce){ .pad button{transition:none} }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" tabindex="0" aria-label="Eclipse Duel 게임 화면"></canvas></div>
<div id="touch" aria-hidden="true">
  <div class="pad dpad">
    <button class="up" data-k="KeyW">▲</button><button class="lf" data-k="KeyA">◀</button>
    <button class="dn" data-k="KeyS">방어</button><button class="rt" data-k="KeyD">▶</button>
  </div>
  <div class="pad acts">
    <button data-k="KeyL">S1</button><button data-k="KeyU">S2</button><button class="ult" data-k="KeyI">궁</button>
    <button data-k="KeyJ">약</button><button data-k="KeyK">강</button><button data-k="Space">대시</button>
  </div>
</div>
<script>
'use strict';
/* =========================================================================
   ECLIPSE DUEL — 1:1 대전 액션 (Canvas 2D, 외부 에셋 없음)
   ========================================================================= */
const cvs = document.getElementById('c'), ctx = cvs.getContext('2d');
const W = 1280, H = 720, GS = 610;           // logical screen, ground line on screen
const STAGE = 1050, GRAV = 2700, TAU = Math.PI * 2;
const FD = '"Black Han Sans","Noto Sans KR",sans-serif', FB = '"Noto Sans KR",sans-serif', FN = '"Rajdhani","Noto Sans KR",sans-serif';
let K = 1;
function resize() {
  const r = cvs.getBoundingClientRect(), d = Math.min(2, window.devicePixelRatio || 1);
  cvs.width = Math.max(320, Math.round(r.width * d)); cvs.height = Math.max(180, Math.round(r.height * d));
  K = cvs.width / W;
}
addEventListener('resize', resize); resize();

/* ---------- math ---------- */
const lerp = (a, b, t) => a + (b - a) * t, clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a), pick = a => a[(Math.random() * a.length) | 0];
const ease = { out: t => 1 - (1 - t) ** 3, io: t => t < .5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2, back: t => { const c = 1.9; return 1 + (c + 1) * (t - 1) ** 3 + c * (t - 1) ** 2; } };
const dirv = a => ({ x: Math.sin(a), y: Math.cos(a) });
const add = (p, v, s = 1) => ({ x: p.x + v.x * s, y: p.y + v.y * s });
const mix = (a, b, t) => ({ x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t) });
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
function mulberry(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const C = { cy: [95, 235, 255], wh: [235, 250, 255], bl: [60, 140, 255], or: [255, 128, 36], ye: [255, 214, 110], rd: [255, 52, 38], gd: [255, 200, 90], vi: [190, 120, 255] };

/* ---------- glow sprites ---------- */
const glowCache = {};
function glowSpr(c) {
  const k = c.join(); if (glowCache[k]) return glowCache[k];
  const s = 128, cv = document.createElement('canvas'); cv.width = cv.height = s;
  const g = cv.getContext('2d'), gr = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  gr.addColorStop(0, rgba(c, 1)); gr.addColorStop(.18, rgba(c, .65)); gr.addColorStop(.45, rgba(c, .18)); gr.addColorStop(1, rgba(c, 0));
  g.fillStyle = gr; g.fillRect(0, 0, s, s); return glowCache[k] = cv;
}
function glow(c, col, x, y, r, a) { if (a <= 0 || r <= 0) return; const pa = c.globalAlpha; c.globalAlpha = pa * Math.min(1, a); c.drawImage(glowSpr(col), x - r, y - r, r * 2, r * 2); c.globalAlpha = pa; }

/* ---------- audio (synth) ---------- */
let AC = null, master = null, nbuf = null, muted = false;
function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = .45; master.connect(AC.destination);
    nbuf = AC.createBuffer(1, AC.sampleRate * 1.5, AC.sampleRate);
    const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function noise(dur, type, f0, f1, gain, q = 1, delay = 0) {
  if (!AC || muted) return; const t = AC.currentTime + delay;
  const s = AC.createBufferSource(); s.buffer = nbuf; const fl = AC.createBiquadFilter(); fl.type = type; fl.Q.value = q;
  fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  s.connect(fl); fl.connect(g); g.connect(master); s.start(t, Math.random()); s.stop(t + dur + .05);
}
function tone(f0, f1, dur, type, gain, delay = 0) {
  if (!AC || muted) return; const t = AC.currentTime + delay;
  const o = AC.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .05);
}
const SFX = {
  swing() { noise(.16, 'bandpass', 2600, 500, .32, 1.4); },
  heavy() { noise(.28, 'bandpass', 1400, 260, .4, 1.1); },
  hit() { tone(170, 55, .16, 'sine', .55); noise(.07, 'highpass', 2500, 1500, .35); },
  big() { tone(120, 38, .32, 'sine', .7); noise(.22, 'lowpass', 3000, 300, .5); },
  block() { tone(1300, 900, .07, 'square', .08); noise(.06, 'highpass', 4000, 3000, .3); },
  thunder() { noise(.08, 'highpass', 5000, 3000, .5); noise(.7, 'lowpass', 2600, 120, .55, .7, .02); tone(80, 35, .5, 'sawtooth', .12); },
  zap() { noise(.12, 'highpass', 6000, 2000, .35); tone(1800, 300, .12, 'square', .05); },
  fire() { noise(.5, 'lowpass', 1400, 220, .45, .8); },
  boom() { tone(95, 28, .8, 'sine', .8); noise(1, 'lowpass', 1800, 60, .75, .6); },
  click() { tone(2400, 2300, .04, 'square', .12); noise(.03, 'highpass', 7000, 6000, .3); },
  ult() { tone(180, 900, .5, 'sawtooth', .08); tone(270, 1350, .5, 'sawtooth', .06); noise(.9, 'bandpass', 300, 5000, .25, .8); },
  ko() { tone(220, 40, 1.2, 'sawtooth', .18); noise(1.4, 'lowpass', 1500, 60, .6); },
  dash() { noise(.14, 'bandpass', 900, 3200, .25, 1.2); },
  ui() { tone(880, 1320, .07, 'triangle', .12); },
};
const sfx = n => { try { SFX[n] && SFX[n](); } catch (e) { } };

/* ---------- input ---------- */
const keys = {}, pressed = {};
const BLOCK = new Set(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Slash', 'Quote', 'Semicolon']);
addEventListener('keydown', e => { if (BLOCK.has(e.code)) e.preventDefault(); if (!keys[e.code]) pressed[e.code] = true; keys[e.code] = true; audioInit(); });
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
const MAP_P1 = { left: ['KeyA'], right: ['KeyD'], up: ['KeyW'], down: ['KeyS'], light: ['KeyJ'], heavy: ['KeyK'], s1: ['KeyL'], s2: ['KeyU'], ult: ['KeyI'], dash: ['Space'] };
const MAP_P1_SOLO = { left: ['KeyA', 'ArrowLeft'], right: ['KeyD', 'ArrowRight'], up: ['KeyW', 'ArrowUp'], down: ['KeyS', 'ArrowDown'], light: ['KeyJ', 'KeyZ'], heavy: ['KeyK', 'KeyX'], s1: ['KeyL', 'KeyC'], s2: ['KeyU', 'KeyV'], ult: ['KeyI', 'KeyB'], dash: ['Space', 'ShiftLeft'] };
const MAP_P2 = { left: ['ArrowLeft'], right: ['ArrowRight'], up: ['ArrowUp'], down: ['ArrowDown'], light: ['Numpad1', 'Comma'], heavy: ['Numpad2', 'Period'], s1: ['Numpad3', 'Slash'], s2: ['Numpad4', 'Semicolon'], ult: ['Numpad5', 'Quote'], dash: ['Numpad0', 'ShiftRight'] };
const ACTS = ['ult', 's1', 's2', 'heavy', 'light', 'dash'];
class KeyCtrl {
  constructor(m) { this.m = m; }
  read() {
    const h = k => this.m[k].some(c => keys[c]), p = k => this.m[k].some(c => pressed[c]);
    return { left: h('left'), right: h('right'), up: h('up'), down: h('down'), upP: p('up'), press: ACTS.find(p) || null };
  }
}
// touch pad
const touchEl = document.getElementById('touch');
if (matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window) touchEl.classList.add('on');
touchEl.querySelectorAll('button').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); audioInit(); if (!keys[k]) pressed[k] = true; keys[k] = true; b.classList.add('down'); };
  const off = e => { e.preventDefault(); keys[k] = false; b.classList.remove('down'); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
});
let mouse = { x: -1, y: -1, click: false };
cvs.addEventListener('pointerdown', e => {
  audioInit(); const r = cvs.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) / r.width * W; mouse.y = (e.clientY - r.top) / r.height * H; mouse.click = true; cvs.focus();
});
cvs.addEventListener('pointermove', e => { const r = cvs.getBoundingClientRect(); mouse.x = (e.clientX - r.left) / r.width * W; mouse.y = (e.clientY - r.top) / r.height * H; });

/* =========================================================================
   FX
   ========================================================================= */
const parts = [], rings = [], slashes = [], bolts = [], texts = [], ghosts = [], ents = [];
let hitstop = 0, shakeA = 0, flashA = 0, flashC = [255, 255, 255], timeScale = 1, tsTarget = 1, tsHold = 0;
const tint = { c: [0, 0, 0], a: 0, to: 0 };
let skyFlash = 0;
function shake(a) { shakeA = Math.max(shakeA, a); }
function flash(a, c = [255, 255, 255]) { if (a > flashA) { flashA = a; flashC = c; } }
function slow(s, hold) { tsTarget = s; timeScale = Math.min(timeScale, s); tsHold = hold; }
function addP(o) {
  if (parts.length > 1500) parts.splice(0, 100);
  parts.push(Object.assign({ x: 0, y: 0, vx: 0, vy: 0, life: .5, t: 0, size: 3, col: C.cy, type: 'spark', drag: 3, grav: 0, rot: 0, vr: 0 }, o));
}
function burst(x, y, n, col, spd, o = {}) {
  for (let i = 0; i < n; i++) {
    const a = o.ang != null ? o.ang + rand(-o.spread, o.spread) : rand(0, TAU), s = rand(spd * .25, spd);
    addP({ x: x + rand(-(o.jx || 0), o.jx || 0), y: y + rand(-(o.jy || 0), o.jy || 0), vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: rand(.25, .6) * (o.lk || 1), size: rand(1.4, 3.4) * (o.sk || 1), col: o.cols ? pick(o.cols) : col, type: o.type || 'spark',
      drag: o.drag ?? 4, grav: o.grav ?? 500, rot: rand(0, TAU), vr: rand(-12, 12) });
  }
}
function ring(x, y, r0, r1, life, col, w = 6, flat = 1) { rings.push({ x, y, r0, r1, life, t: 0, col, w, flat }); }
function slashFx(x, y, r, ang, col, o = {}) { slashes.push({ x, y, r, ang, col, t: 0, life: o.life || .22, w: o.w || .32, span: o.span || 2.3, flip: o.flip || 1 }); }
function boltPts(x1, y1, x2, y2, rough) {
  let pts = [{ x: x1, y: y1 }, { x: x2, y: y2 }], off = Math.hypot(x2 - x1, y2 - y1) * rough;
  for (let k = 0; k < 6; k++) {
    const np = [pts[0]];
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
      const m = rand(-off, off); np.push({ x: (a.x + b.x) / 2 - dy / d * m, y: (a.y + b.y) / 2 + dx / d * m }, b);
    }
    pts = np; off *= .5;
  }
  return pts;
}
function bolt(x1, y1, x2, y2, o = {}) {
  const b = { x1, y1, x2, y2, t: 0, life: o.life || .25, col: o.col || C.cy, w: o.w || 3, rough: o.rough || .18, regen: 0, branches: o.branches ?? 2 };
  b.pts = boltPts(x1, y1, x2, y2, b.rough); b.br = makeBranches(b); bolts.push(b); return b;
}
function makeBranches(b) {
  const br = [];
  for (let i = 0; i < b.branches; i++) {
    const p = b.pts[(rand(.2, .8) * b.pts.length) | 0], a = Math.atan2(b.y2 - b.y1, b.x2 - b.x1) + rand(-1, 1), l = Math.hypot(b.x2 - b.x1, b.y2 - b.y1) * rand(.15, .35);
    br.push(boltPts(p.x, p.y, p.x + Math.cos(a) * l, p.y + Math.sin(a) * l, .25));
  }
  return br;
}
function popText(x, y, txt, col, size = 30) { texts.push({ x: x + rand(-14, 14), y, txt, col, size, t: 0, life: .9 }); }
function ghost(f, R, o = {}) { ghosts.push({ def: f.def, R: R || f.R, x: o.x ?? f.x, y: o.y ?? f.y, facing: o.facing ?? f.facing, t: 0, life: o.life || .35, a: o.a || .5 }); }

function updateFx(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.t += dt; if (p.t >= p.life) { parts.splice(i, 1); continue; }
    const dr = Math.exp(-p.drag * dt); p.vx *= dr; p.vy *= dr; p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
  }
  for (const arr of [rings, slashes, texts, ghosts]) for (let i = arr.length - 1; i >= 0; i--) { arr[i].t += dt; if (arr[i].t >= arr[i].life) arr.splice(i, 1); }
  for (let i = bolts.length - 1; i >= 0; i--) {
    const b = bolts[i]; b.t += dt; b.regen -= dt; if (b.t >= b.life) { bolts.splice(i, 1); continue; }
    if (b.regen <= 0) { b.regen = .035; b.pts = boltPts(b.x1, b.y1, b.x2, b.y2, b.rough); b.br = makeBranches(b); }
  }
}
function strokePts(c, pts) { c.beginPath(); c.moveTo(pts[0].x, pts[0].y); for (let i = 1; i < pts.length; i++) c.lineTo(pts[i].x, pts[i].y); c.stroke(); }
function drawFx(c) {
  c.save(); c.globalCompositeOperation = 'lighter'; c.lineCap = 'round'; c.lineJoin = 'round';
  // rings
  for (const r of rings) {
    const k = r.t / r.life, rad = lerp(r.r0, r.r1, ease.out(k));
    c.save(); c.translate(r.x, r.y); c.scale(1, r.flat); c.strokeStyle = rgba(r.col, (1 - k) * .9); c.lineWidth = r.w * (1 - k) + 1;
    c.beginPath(); c.arc(0, 0, rad, 0, TAU); c.stroke(); c.strokeStyle = rgba(C.wh, (1 - k) * .5); c.lineWidth = Math.max(1, r.w * .3 * (1 - k)); c.stroke(); c.restore();
  }
  // slashes (crescents)
  for (const s of slashes) {
    const k = s.t / s.life, R = s.r * lerp(.75, 1.15, ease.out(k)), a = 1 - k;
    c.save(); c.translate(s.x, s.y); c.rotate(s.ang); c.scale(1, s.flip);
    const sp = s.span * lerp(.6, 1, ease.out(Math.min(1, k * 3)));
    c.beginPath(); c.arc(0, 0, R, -sp / 2, sp / 2); c.arc(-R * s.w, 0, R * (1 - s.w * .55), sp / 2 * .92, -sp / 2 * .92, true); c.closePath();
    const g = c.createRadialGradient(-R * .3, 0, R * .3, 0, 0, R);
    g.addColorStop(0, rgba(s.col, 0)); g.addColorStop(.6, rgba(s.col, .55 * a)); g.addColorStop(.92, rgba(C.wh, a)); g.addColorStop(1, rgba(s.col, .2 * a));
    c.fillStyle = g; c.fill(); c.restore();
  }
  // bolts
  for (const b of bolts) {
    const a = 1 - b.t / b.life, fl = Math.random() < .25 ? .5 : 1;
    const draw = (pts, w) => {
      c.strokeStyle = rgba(b.col, .18 * a * fl); c.lineWidth = w * 6; strokePts(c, pts);
      c.strokeStyle = rgba(b.col, .7 * a * fl); c.lineWidth = w * 2; strokePts(c, pts);
      c.strokeStyle = rgba(C.wh, a * fl); c.lineWidth = Math.max(1, w * .7); strokePts(c, pts);
    };
    draw(b.pts, b.w); for (const br of b.br) draw(br, b.w * .45);
    glow(c, b.col, b.x2, b.y2, 40 * b.w / 3, .5 * a);
  }
  // particles
  for (const p of parts) {
    const k = p.t / p.life, a = 1 - k;
    if (p.type === 'spark') {
      const sp = Math.hypot(p.vx, p.vy), l = clamp(sp * .03, 2, 46) * (1 - k * .5);
      c.strokeStyle = rgba(p.col, a); c.lineWidth = p.size * (1 - k * .6);
      c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(p.x - p.vx / (sp || 1) * l, p.y - p.vy / (sp || 1) * l); c.stroke();
    } else if (p.type === 'glow') glow(c, p.col, p.x, p.y, p.size * (1 + k * .8), a * .8);
    else if (p.type === 'ember') { const f = .6 + .4 * Math.sin(p.t * 30 + p.rot * 10); glow(c, p.col, p.x, p.y, p.size * 3, a * f * .9); c.fillStyle = rgba(C.wh, a * f * .7); c.fillRect(p.x - .8, p.y - .8, 1.6, 1.6); }
    else if (p.type === 'shard') { c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.fillStyle = rgba(p.col, a); c.beginPath(); c.moveTo(0, -p.size * 2); c.lineTo(p.size, 0); c.lineTo(0, p.size * 2); c.lineTo(-p.size, 0); c.fill(); c.restore(); }
  }
  c.restore();
  // smoke (normal blend)
  for (const p of parts) if (p.type === 'smoke') {
    const k = p.t / p.life; c.fillStyle = `rgba(30,18,26,${.22 * (1 - k)})`; c.beginPath(); c.arc(p.x, p.y, p.size * (1 + k * 2.2), 0, TAU); c.fill();
  }
}
function drawTexts(c) {
  for (const t of texts) {
    const k = t.t / t.life, s = k < .12 ? lerp(1.8, 1, k / .12) : 1, a = k > .7 ? (1 - k) / .3 : 1;
    c.save(); c.translate(t.x, t.y - k * 60); c.scale(s, s); c.globalAlpha = a;
    c.font = `${t.size}px ${FD}`; c.textAlign = 'center'; c.lineWidth = 5; c.strokeStyle = 'rgba(0,0,0,.75)'; c.strokeText(t.txt, 0, 0);
    c.fillStyle = t.col; c.fillText(t.txt, 0, 0); c.restore();
  }
}

/* =========================================================================
   RIG + CLOTH
   ========================================================================= */
const POSE0 = { lx: 0, hy: 0, bd: 0, hd: 0, ua1: 0, la1: 0, ua2: 0, la2: 0, th1: 0, sh1: 0, th2: 0, sh2: 0, wp: 0, rot: 0 };
const PK = Object.keys(POSE0);
const mkPose = (...o) => Object.assign({}, POSE0, ...o);
function rigFrom(def, p, ground) {
  const D = def.dims, drop = (a, b) => D.th * Math.cos(a) + D.sh * Math.cos(a + b);

  const k2 = add(hp2, dirv(p.th2), D.th), f2 = add(k2, dirv(p.th2 + p.sh2), D.sh);

class Chain {

function limb(c, a, b, w1, w2, light, dark, line) {

for (const def of [KAIREN, VELLONA]) for (const m of Object.values(def.moves)) {
  let cur = Object.assign({}, def.base); m.kp = [];
  m.keys = m.keys.map(([t, o]) => {
    if (o === 'base') cur = Object.assign({}, def.base); else if (typeof o === 'string') cur = Object.assign({}, def.base, def.poses[o]); else cur = Object.assign({}, cur, o);
    const p = Object.assign({}, cur); m.kp.push(o === 'base' || typeof o === 'string' ? {} : Object.assign({}, p)); return [t, p];
  });
}

function strikeEnt(f, x, delay) {
  return { t: -delay, done: false, x,
    update(dt) {
      this.t += dt; if (this.t < 0) return;
      if (this.t < .26) { if (Math.random() < .5) addP({ x: this.x + rand(-30, 30), y: -2, vx: 0, vy: rand(-200, -60), type: 'spark', col: C.cy, size: 1.6, life: .2, grav: 0 }); }
      else if (!this.hitDone) {
        this.hitDone = true; sfx('thunder'); skyFlash = Math.max(skyFlash, .6);
        bolt(this.x + rand(-20, 20), -800, this.x, 0, { life: .35, w: 5, branches: 3 }); bolt(this.x + rand(-40, 40), -800, this.x + rand(-10, 10), 0, { life: .25, w: 2.5 });

        hitWorld(f, f.opp, { l: this.x - 48, r: this.x + 48, t: -420, b: 4 }, { dmg: 46, kx: 60, ky: -380, stun: .5, hs: .07, shake: 8 }, Math.sign(f.opp.x - this.x) || f.facing);
      }
      if (this.t > .6) this.done = true;
    },
    draw(c) {
      if (this.t < 0) return; c.save(); c.globalCompositeOperation = 'lighter';
      if (this.t < .26) { const k = this.t / .26; c.save(); c.translate(this.x, 0); c.scale(1, .22); glow(c, C.cy, 0, 0, 40 + 60 * k, .4 + .5 * k); c.strokeStyle = rgba(C.cy, .7); c.lineWidth = 3; c.beginPath(); c.arc(0, 0, 70 * (1 - k) + 20, 0, TAU); c.stroke(); c.restore(); }
      else { const k = (this.t - .26) / .34; glow(c, C.cy, this.x, -20, 120 * (1 - k), .8 * (1 - k)); }
      c.restore();
    } };
}

/* ---------- ultimate cut-in ---------- */
