<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eclipse Duel 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<script type="importmap">{ "imports": { "three": "../lib/three.module.js" } }</script>
<style>
/* Layout: full-window WebGL canvas, HTML HUD layered on top. Single dark arena look by design. */
:root{
  --bg:#06050a; --ink:#ecebf3; --dim:rgba(236,235,243,.62); --line:rgba(255,255,255,.16); --panel:rgba(10,8,16,.78);
  --p1:#46e6ff; --p2:#ff7a2a; --gold:#ffd27a; --danger:#ff4a4a;
  --f-display:"Black Han Sans","Noto Sans KR",system-ui,sans-serif; --f-body:"Noto Sans KR",system-ui,sans-serif; --f-num:"Rajdhani","Noto Sans KR",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none}
.top{position:absolute;left:0;right:0;top:calc(14px + env(safe-area-inset-top,0px));display:flex;justify-content:center;align-items:flex-start;gap:14px;padding:0 16px}
.pl{flex:1 1 0;max-width:540px;min-width:0;--acc:var(--p1)}
.pl .hpbar{position:relative;height:24px;background:rgba(14,10,18,.85);clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%);overflow:hidden;border:1px solid var(--line)}
.pl.p2 .hpbar{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 100%,14px 100%)}
.pl .hpbar i{position:absolute;inset:0;transform-origin:left center;transition:none}
.pl.p2 .hpbar i{transform-origin:right center}
.pl .chip{background:#f3eee6}
.pl .fill{background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 60%,#fff) 0%,var(--acc) 55%,color-mix(in srgb,var(--acc) 55%,#000) 100%)}
.pl .hpbar::after{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:rgba(255,255,255,.22)}
.pl.low .fill{animation:low .5s steps(2) infinite}
@keyframes low{50%{background:var(--danger)}}
.pl .meta{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.pl.p2 .meta{flex-direction:row-reverse}
.pl .nm{font:26px var(--f-display);letter-spacing:.02em;text-shadow:0 2px 0 #000}
.pl .tt{font-size:12.5px;font-weight:700;color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pl .num{margin-left:auto;font:700 15px var(--f-num);color:var(--dim);font-variant-numeric:tabular-nums}
.pl.p2 .num{margin-left:0;margin-right:auto}
.pl .pips{display:flex;gap:8px;margin-top:4px}
.pl.p2 .pips{justify-content:flex-end}
.pl .pips i{width:11px;height:11px;transform:rotate(45deg);background:rgba(255,255,255,.14)}
.pl .pips i.on{background:var(--acc);box-shadow:0 0 10px var(--acc)}
#timer{flex:none;width:84px;height:84px;display:grid;place-content:center;text-align:center;background:var(--panel);border:1px solid var(--line);
  clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
#timer b{font:44px/1 var(--f-display);font-variant-numeric:tabular-nums}
#timer b.warn{color:var(--danger)}
#timer small{display:block;font:700 10.5px var(--f-num);letter-spacing:.12em;color:var(--dim);margin-top:2px}
.bot{position:absolute;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding:0 16px}
.eb{display:flex;align-items:flex-end;gap:14px;--acc:var(--p1);min-width:0}
.eb.p2{flex-direction:row-reverse}
.en{width:min(30vw,340px)}
.enlabel{font:15px var(--f-display);color:var(--dim);margin-bottom:6px;white-space:nowrap}
.eb.p2 .enlabel{text-align:right}
.enbar{position:relative;height:14px;background:rgba(14,10,18,.85);border:1px solid var(--line);overflow:hidden;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.enfill{position:absolute;inset:0;transform-origin:left;background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 50%,#000),var(--acc))}
.eb.p2 .enfill{transform-origin:right}
.enbar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(25% - 2px),rgba(0,0,0,.7) calc(25% - 2px) 25%)}
.eb.full .enlabel{color:#fff;animation:pulse .5s ease-in-out infinite alternate}
.eb.full .enfill{background:linear-gradient(90deg,var(--acc),#fff);box-shadow:0 0 18px var(--acc)}
@keyframes pulse{to{color:var(--acc);text-shadow:0 0 12px var(--acc)}}
.skills{display:flex;gap:8px}
.sk{position:relative;width:56px;height:56px;background:var(--panel);border:1.5px solid var(--acc);display:grid;place-content:center;text-align:center;overflow:hidden}
.sk b{font:13px var(--f-display);line-height:1.1}
.sk span{font:700 13px var(--f-num);color:var(--acc)}
.sk i{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.66) calc(var(--p,0)*360deg),transparent 0);pointer-events:none}
.sk.cool{border-color:var(--line)}
.sk.cool span{color:#fff}
.combo{position:absolute;top:150px;left:28px;--acc:var(--p1);text-shadow:0 3px 0 rgba(0,0,0,.6)}
.combo.p2{left:auto;right:28px;text-align:right}
.combo b{display:block;font:68px/1 var(--f-display);color:var(--acc)}
.combo span{font:20px var(--f-display)}
.combo.pop b{animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(1.5)}}
#announce{position:absolute;left:0;right:0;top:38%;text-align:center;opacity:0}
#announce h1{margin:0;font:clamp(56px,9vw,112px)/1 var(--f-display);letter-spacing:.02em;-webkit-text-stroke:2px rgba(0,0,0,.6);text-shadow:0 6px 0 rgba(0,0,0,.45)}
#announce p{margin:10px 0 0;font:28px var(--f-display)}
#announce.on{animation:ann 1.2s ease-out forwards}
#announce.gold h1{color:var(--gold)} #announce.red h1{color:var(--danger)}
@keyframes ann{0%{opacity:0;transform:scale(1.9)}12%{opacity:1;transform:scale(1)}80%{opacity:1;transform:scale(1.04)}100%{opacity:0;transform:scale(1.06)}}
#dmg{position:fixed;inset:0;pointer-events:none}
.dn{position:fixed;transform:translate(-50%,-50%);font:30px var(--f-display);color:#fff;-webkit-text-stroke:1.5px rgba(0,0,0,.8);animation:dn .9s ease-out forwards}
.dn.big{font-size:46px;color:var(--gold)} .dn.blk{font-size:20px;color:#bfc6d4}
@keyframes dn{0%{transform:translate(-50%,-50%) scale(1.8);opacity:1}15%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{transform:translate(-50%,-160%);opacity:0}}
#flash{position:fixed;inset:0;opacity:0;pointer-events:none;mix-blend-mode:screen}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.5) 100%)}
#trainBar{position:absolute;left:50%;top:118px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--dim);white-space:nowrap}
#trainBar b{color:var(--ink);font-weight:700}

/* ---------- 궁극기 컷인 ---------- */
#cutin{position:fixed;inset:0;display:grid;grid-template-rows:1fr 32vh 1fr;pointer-events:none;--acc:var(--p1);--band:#06283a}
#cutin .shade{background:rgba(0,0,0,.7)}
#cutin .band{position:relative;border-block:3px solid var(--acc);overflow:hidden;transform:scaleY(0)}
#cutin.on .band{animation:bandIn .22s ease-out forwards}
#cutin.on .shade{animation:fadeIn .18s ease-out}
#cutin.out .band{animation:bandOut .22s ease-in forwards}
#cutin .band::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 0 38%,color-mix(in srgb,var(--band) 85%,transparent) 62%)}
#cutin .lines{position:absolute;inset:-20% 0;opacity:.55;mix-blend-mode:screen;
  background:repeating-linear-gradient(176deg,transparent 0 14px,color-mix(in srgb,var(--acc) 50%,transparent) 14px 16px,transparent 16px 37px,rgba(255,255,255,.5) 37px 38px,transparent 38px 61px);
  background-size:900px 100%;animation:lines .35s linear infinite}
@keyframes lines{to{background-position:-900px 0}}
@keyframes bandIn{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes bandOut{from{transform:scaleY(1)}to{transform:scaleY(0)}}
@keyframes fadeIn{from{opacity:0}}
#cutin .cinfo{position:absolute;right:5vw;top:50%;transform:translateY(-50%);text-align:right;animation:txtIn .4s .08s ease-out both}
#cutin small{font:20px var(--f-display);color:var(--acc)}
#cutin h2{margin:4px 0;font:clamp(54px,8.5vw,118px)/1 var(--f-display);background:linear-gradient(180deg,#fff 30%,var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(0,0,0,.6))}
#cutin p{margin:0;font:clamp(18px,2.4vw,30px) var(--f-display)}
@keyframes txtIn{from{transform:translate(18vw,-50%);opacity:0}}

/* ---------- 화면 (타이틀 · 일시정지 · 결과) ---------- */
.screen{position:fixed;inset:0;overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(90deg,rgba(6,5,10,.92) 0,rgba(6,5,10,.72) 46%,rgba(6,5,10,.1) 75%)}
.wrapT{max-width:600px;display:grid;gap:12px;margin-left:clamp(0px,4vw,60px)}
.logo{margin:0;font:clamp(40px,5.4vw,68px)/.95 var(--f-display);background:linear-gradient(90deg,var(--p1),#fff 55%,var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent;text-wrap:balance}
.logo small{display:block;font-size:.34em;letter-spacing:.3em;margin-top:6px;-webkit-text-fill-color:var(--dim)}
.lede{margin:0;color:var(--dim);max-width:56ch;line-height:1.5;font-size:13.5px}
.lbl{font:700 12px var(--f-num);letter-spacing:.16em;color:var(--dim);text-transform:uppercase;margin-bottom:6px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{background:var(--panel);border:1px solid var(--line);padding:10px 16px;font-weight:700;font-size:14px;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#0a0812;border-color:var(--ink)}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.card{position:relative;text-align:left;background:var(--panel);border:1px solid var(--line);padding:8px 12px;min-height:58px;display:grid;align-content:space-between}
.card b{font:18px var(--f-display)}
.card span{font-size:11.5px;color:var(--dim)}
.card[aria-pressed="true"]{border-color:var(--sel,var(--p1));box-shadow:inset 0 0 0 1px var(--sel,var(--p1))}
.card .tag{position:absolute;top:6px;right:8px;font:700 11px var(--f-num);color:var(--sel,var(--p1))}
.card.empty{border-style:dashed;color:var(--dim);cursor:default;opacity:.55}
.info{background:var(--panel);border:1px solid var(--line);padding:12px 16px;display:grid;gap:6px}
.info h3{margin:0;font:22px var(--f-display)} .info p{margin:0;font-size:13px;color:var(--dim);line-height:1.55}
.mv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.mv dt{color:var(--p1);font-weight:700} .mv dd{margin:0;color:var(--dim)}
.go{justify-self:start;background:var(--ink);color:#0a0812;border:0;padding:12px 32px;font:20px var(--f-display);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.keys{font-size:12.5px;color:var(--dim);line-height:1.8}
.keys kbd{display:inline-block;min-width:1.8em;text-align:center;padding:0 5px;border:1px solid var(--line);border-bottom-width:2px;font:700 12px var(--f-num);color:var(--ink);background:rgba(255,255,255,.05);margin:0 1px}
.center{display:grid;place-content:center;justify-items:center;text-align:center;gap:16px;background:rgba(6,5,10,.72)}
.center h2{margin:0;font:clamp(48px,8vw,96px)/1 var(--f-display)}
.center .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ghostb{background:var(--panel);border:1px solid var(--line);padding:14px 26px;font:18px var(--f-display);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}

/* ---------- 터치 ---------- */
#touch{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:flex-end;padding:0 16px calc(84px + env(safe-area-inset-bottom,0px));pointer-events:none}
#touch.on{display:flex}
.pad{display:grid;gap:8px;pointer-events:auto}
.dpad{grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px)}
.acts{grid-template-columns:repeat(4,52px);grid-template-rows:repeat(2,52px)}
.pad button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);border-radius:50%;font:700 13px var(--f-body);padding:0;touch-action:none}
.pad button.down{background:rgba(255,255,255,.3)}
.dpad .u{grid-column:2;grid-row:1}.dpad .l{grid-column:1;grid-row:2}.dpad .d{grid-column:2;grid-row:2}.dpad .r{grid-column:3;grid-row:2}
@media (max-width:720px){ .pl .tt,.pl .num{display:none} .sk{width:46px;height:46px} .combo{top:120px} .combo b{font-size:48px} }
@media (prefers-reduced-motion:reduce){ #cutin .lines{animation:none} }
</style>
</head>
<body>
<canvas id="gl" tabindex="0" aria-label="Eclipse Duel 3D 게임 화면"></canvas>
<div id="vignette"></div>

<div id="hud" hidden>
  <div class="top">
    <div class="pl p1"><div class="hpbar"><i class="chip"></i><i class="fill"></i></div><div class="meta"><span class="nm"></span><span class="tt"></span><span class="num"></span></div><div class="pips"></div></div>
    <div id="timer"><b>99</b><small>ROUND 1</small></div>
    <div class="pl p2"><div class="hpbar"><i class="chip"></i><i class="fill"></i></div><div class="meta"><span class="nm"></span><span class="tt"></span><span class="num"></span></div><div class="pips"></div></div>
  </div>
  <div id="trainBar" hidden></div>
  <div class="combo p1" hidden></div><div class="combo p2" hidden></div>
  <div class="bot">
    <div class="eb p1"><div class="en"><div class="enlabel"></div><div class="enbar"><i class="enfill"></i></div></div><div class="skills"></div></div>
    <div class="eb p2"><div class="en"><div class="enlabel"></div><div class="enbar"><i class="enfill"></i></div></div><div class="skills"></div></div>
  </div>
  <div id="announce"></div>
</div>
<div id="dmg"></div>
<div id="cutin" hidden><div class="shade"></div><div class="band"><div class="lines"></div><div class="cinfo"><small></small><h2></h2><p></p></div></div><div class="shade"></div></div>
<div id="flash"></div>

<section id="title" class="screen">
  <div class="wrapT">
    <h1 class="logo">ECLIPSE DUEL<small>3D · 일식의 신전</small></h1>
    <p class="lede">호수 위 원형 결투장에서 벌이는 1:1 3D 대전. 지금은 시스템 확인용 기체 하나만 들어 있고, 정식 캐릭터는 하나씩 추가됩니다.</p>
    <div><div class="lbl">모드</div><div class="seg" id="modes">
      <button data-mode="cpu" aria-pressed="true">1P vs CPU</button><button data-mode="pvp" aria-pressed="false">2P 로컬 대전</button><button data-mode="training" aria-pressed="false">훈련 모드</button>
    </div></div>
    <div><div class="lbl">1P 캐릭터</div><div class="roster" id="r1"></div></div>
    <div><div class="lbl" id="r2lbl">상대 캐릭터</div><div class="roster" id="r2"></div></div>
    <div class="info" id="charInfo"></div>
    <button class="go" id="start">결투 시작 <span style="font-size:.7em;opacity:.6">Enter</span></button>
    <div class="keys" id="keyHelp"></div>
  </div>
</section>
<section id="pause" class="screen center" hidden>
  <h2>일시정지</h2>
  <div class="keys" id="pauseKeys"></div>
  <div class="row"><button class="go" data-act="resume">계속하기</button><button class="ghostb" data-act="title">타이틀로</button></div>
</section>
<section id="result" class="screen center" hidden>
  <div class="lbl" id="resSub"></div>
  <h2 id="resTitle"></h2>
  <div class="keys" id="resScore"></div>
  <div class="row"><button class="go" data-act="rematch">다시 하기</button><button class="ghostb" data-act="title">캐릭터 선택</button></div>
</section>

<div id="touch" aria-hidden="true">
  <div class="pad dpad"><button class="u" data-k="KeyW">▲</button><button class="l" data-k="KeyA">◀</button><button class="d" data-k="KeyS">▼</button><button class="r" data-k="KeyD">▶</button></div>
  <div class="pad acts">
    <button data-k="KeyU">S1</button><button data-k="KeyI">S2</button><button data-k="KeyO" style="border-color:var(--p2)">궁</button><button data-k="KeyL">방어</button>
    <button data-k="KeyJ">약</button><button data-k="KeyK">강</button><button data-k="Space">점프</button><button data-k="ShiftLeft">대시</button>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
